# Some code below is copied/derived from <https://github.com/emilk/egui/blob/6b420bc1b11cd4f37d5db6b5e0a2e369f259dd35/.github/workflows/rust.yml>.
# See ATTRIBUTION.md for attribution details.

name: Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fmt-crank-check-test:
    name: Format + check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - run: cargo clippy --locked --all-features --all-targets

      - run: cargo doc --lib --no-deps --all-features

      - name: clippy release
        run: cargo clippy --all-targets --all-features --release -- -D warnings

  # ---------------------------------------------------------------------------

  tests:
    name: Run tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features --no-fail-fast

      - name: Run doc-tests
        if: always()
        run: cargo test --all-features --doc --no-fail-fast

  # ---------------------------------------------------------------------------

  compare-generated-bindings-against-reference-bindings:
    name: Compare generated bindings against reference bindings
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - uses: extractions/setup-just@v4

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Compare generated bindings against reference bindings
        run: just compare-generated-bindings-against-reference-bindings

  # ---------------------------------------------------------------------------

  check-stale-generated-contents:
    name: Check whether some generated contents are stale
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - uses: extractions/setup-just@v4

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Detect stale generated schemata
        run: just detect-stale-generated-schemata

      - name: Detect stale generated reference bindings
        if: always()
        run: just detect-stale-generated-reference-bindings

  # ---------------------------------------------------------------------------

  check-openfx-submodule-main-or-ancestor:
    name: Check whether the openfx submodule is on main or an ancestor of main
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check Submodule Name
        uses: jtmullen/submodule-branch-check-action@v1
        with:
          path: test-fixtures/openfx
          branch: main
          first_parent: true
          disable_progression: true
