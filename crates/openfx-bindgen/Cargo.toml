[package]
name = "openfx-bindgen"
publish = false
version = "0.6.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/kreantio/openfx-datagen"
default-run = "cli"

[dependencies]
openfx-datagen = { path = "../openfx-datagen", version = "0.6.0" }

clap = { version = "=4.6.6", features = ["derive"] }
convert_case = "=0.11.0"
prettyplease = "=0.3.0"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
rayon = "=1.12.0"
regex = "=1.13.1"
serde_json = "=1.0.151"
syn = { version = "=3.0.3", features = ["full", "visit", "visit-mut"] }

[[bin]]
name = "cli"
path = "src/bin/cli.rs"
