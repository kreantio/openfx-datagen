[package]
name = "openfx-datagen"
publish = false
version = "0.6.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/kreantio/openfx-datagen"
default-run = "cli"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
rayon = "=1.12.0"
regex = "=1.13.1"
schemars = { version = "=1.2.2", features = ["preserve_order"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
snafu = "=0.9.2"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
tree-sitter = "=0.26.2"
tree-sitter-c = "=0.24.2"
treesitter-types-c = "=1.0.0"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = "=0.3.0"
